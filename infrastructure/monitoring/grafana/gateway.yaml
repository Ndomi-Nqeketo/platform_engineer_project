apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grafana-gateway
  namespace: monitoring
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: grafana.ndomi.local
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-tls
            group: ""
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: prometheus-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      sectionName: websecure
  hostnames:
    - prometheus.ndomi.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: prometheus-kube-prometheus-prometheus
          port: 9090
          weight: 1

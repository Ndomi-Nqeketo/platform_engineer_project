apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: godaddy-webhook
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/snowdrop/godaddy-webhook.git
    targetRevision: masters
    path: deploy/godaddy-webhook
  
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
    syncOptions:
      - CreateNamespace=true
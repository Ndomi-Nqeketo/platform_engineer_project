apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: vault
    namespace: argocd
spec:
  sources:
    repoURL: https://github.com/Ndomi-Nqeketo/platform_engineer_project
    targetRevision: masters
    path: infrastructure/argocd/base/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
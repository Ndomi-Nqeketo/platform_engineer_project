apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://kubernetes-sigs.github.io/descheduler/
    chart: descheduler
    targetRevision: 0.33.0
    helm:
      releaseName: descheduler
      values: |
        # CronJob mode: this is what actually controls run frequency (deschedulingInterval is ignored)
        schedule: "*/10 * * * *"

        deschedulerPolicy:
          maxNoOfPodsToEvictPerNode: 1
          maxNoOfPodsToEvictTotal: 5

          profiles:
            - name: default
        
              pluginConfig:
                - name: DefaultEvictor
                  args:
                    nodeFit: true
                    minPodAge: 10m
        
                - name: RemovePodsViolatingNodeAffinity
                  args:
                    nodeAffinityType:
                      - requiredDuringSchedulingIgnoredDuringExecution
        
                - name: RemovePodsViolatingInterPodAntiAffinity
        
                - name: LowNodeUtilization
                  args:
                    # wider gap = harder to trigger, fewer/less sensitive evictions
                    thresholds:
                      cpu: 10
                      memory: 10
                      pods: 10
                    targetThresholds:
                      cpu: 60
                      memory: 60
                      pods: 60
                    # masterhub-frontend keeps bouncing back onto the "underutilized" node; stop evicting it
                    evictableNamespaces:
                      exclude:
                        - masterhub
        
              plugins:
                balance:
                  enabled:
                    - LowNodeUtilization
        
                deschedule:
                  enabled:
                    - RemovePodsViolatingNodeAffinity
                    - RemovePodsViolatingInterPodAntiAffinity
  
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
    syncOptions:
      - CreateNamespace=true
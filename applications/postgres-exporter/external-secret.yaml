apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  
  target:
    name: postgres-exporter
    creationPolicy: Owner
  
  data:
    - secretKey: password
      remoteRef:
        key: masterhub-postgres
        property: password
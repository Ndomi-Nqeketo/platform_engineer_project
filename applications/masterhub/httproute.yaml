apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: masterhub
  namespace: masterhub
spec:
  parentRefs:
    - name: masterhub-gateway
  hostnames:
    - masterhub.ndomi.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: masterhub-frontend
          port: 80
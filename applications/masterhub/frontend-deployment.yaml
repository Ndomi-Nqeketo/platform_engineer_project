apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterhub-frontend
  namespace: masterhub
  labels:
    app: masterhub-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: masterhub-frontend
  template:
    metadata:
      labels:
        app: masterhub-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: frontend
          image: ndomi/mastershub-frontend:v1.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
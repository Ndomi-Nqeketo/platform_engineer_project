apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: masterhub-minio
  namespace: masterhub
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  
  target:
    name: masterhub-minio
    creationPolicy: Owner
  
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: minio-root
        property: username
    
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: minio-root
        property: password
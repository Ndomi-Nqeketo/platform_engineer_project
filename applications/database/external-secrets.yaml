apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: masterhub-postgres
  namespace: masterhub
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
    
  target:
    name: masterhub-postgres
    creationPolicy: Owner
    
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: masterhub-postgres
        property: host
        
    - secretKey: DB_PORT
      remoteRef:
        key: masterhub-postgres
        property: port
        
    - secretKey: DB_NAME
      remoteRef:
        key: masterhub-postgres
        property: database
        
    - secretKey: DB_USER
      remoteRef:
        key: masterhub-postgres
        property: username
        
    - secretKey: DB_PASSWORD
      remoteRef:
        key: masterhub-postgres
        property: password
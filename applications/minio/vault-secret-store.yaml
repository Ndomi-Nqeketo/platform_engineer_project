apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: minio
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: minio
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: vault-auth
      path: secret
      server: http://vault.vault.svc.cluster.local:8200
      version: v2
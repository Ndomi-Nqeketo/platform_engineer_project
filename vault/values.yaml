server:
  dev:
    enabled: false
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: openebs-hostpath
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = 1
      }

      storage "raft" {
        path = "/vault/data"
      }

      service_registration "kubernetes" {}

injector:
  enabled: false

ui:
  enabled: true
